# bridge-config.yaml — default configuration for the MCP Bridge Server.
#
# This file is embedded into the binary (see config.go) and used whenever no
# external config file is found at the resolved location. Copy it alongside
# the binary and edit it to customize the bridge for your machine.
#
# This build implements ONLY the memory subsystem (see IMPLEMENTATION-PROMPT.md
# at the mcp-bridge repo root for the full scope decision). Sections below
# marked "not yet honored by this build" are parsed so the config schema is
# forward-compatible with the full twelve-tool design, but the bridge does not
# act on them yet.

# Async executor settings (shared by spawn_agent and run_command).
# Not yet honored by this build: spawn_agent and run_command are not
# implemented, so this section is parsed and otherwise unused.
async:
  sync_window_seconds: 25
  job_expiry_seconds: 600

# Default working directory for spawn_agent and run_command.
# Not yet honored by this build: no subprocess-launching tools exist yet.
default_working_directory: "C:\\franl"

# Sub-agent defaults (for spawn_agent tool).
# Not yet honored by this build: spawn_agent is not implemented.
sub_agent:
  default_timeout_seconds: 300
  default_max_output_tokens: 4000
  max_concurrent_agents: 5

# Local command execution (for run_command tool).
# Not yet honored by this build: run_command is not implemented.
run_command:
  shell: "C:\\apps\\cygwin\\bin\\bash.exe"
  shell_args: ["-c"]
  default_timeout_seconds: 120
  default_max_output_bytes: 51200

# Memory directory (the memory root; the bridge owns everything under it).
# This section IS honored by this build.
memory:
  directory: "C:\\franl\\.claude-agent-memory"
  summary_max_length: 200

# Handle management (see design spec Section 3.14). This section IS honored
# by this build, except that handle EVICTION only ever runs during the
# (deferred) maintenance sweep, so in this build handles are minted and
# tracked but never evicted.
handle:
  id_length: 8
  retention_days: 60

# Bridge state persistence (see design spec Section 3.18). This section IS
# honored by this build.
persistence:
  state_file: ".bridge-state.json"
  checkpoint_interval_seconds: 5

# Branching (concurrent read-modify-write race resolution).
# Not yet honored by this build: branching is not implemented. This build
# always uses last-writer-wins semantics regardless of this setting; if it is
# set to true, the bridge logs a startup warning rather than silently implying
# behavior that isn't there.
branching:
  enabled: false

# Maintenance (see design spec Section 3.13).
# Not yet honored by this build: memory_run_maintenance is not implemented.
maintenance:
  max_blocks_per_call: 10

# Logging. This section IS honored by this build.
logging:
  file: "C:\\franl\\.claude-agent-memory\\bridge.log"
  level: "info"
  max_size_mb: 10
  max_backups: 3

# Claude Code CLI path (if not in PATH).
# Not yet honored by this build: no tool in this build spawns the CLI.
claude_cli:
  path: "claude"
